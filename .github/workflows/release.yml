name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., 25.10.26)'
        required: true
        type: string

jobs:
  validate-version:
    name: Validate Version Match
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      pkhex_version: ${{ steps.pkhex.outputs.version }}
      should_deploy: ${{ steps.compare.outputs.should_deploy }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || '' }}
        submodules: recursive
        fetch-depth: 0

    - name: Extract tag version
      id: extract
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.tag }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Tag version: $VERSION"

    - name: Get PKHeX submodule version
      id: pkhex
      run: |
        PKHEX_TAG=$(git -C lib/PKHeX describe --tags --abbrev=0 2>/dev/null || echo "unknown")
        echo "version=$PKHEX_TAG" >> $GITHUB_OUTPUT
        echo "PKHeX version: $PKHEX_TAG"

    - name: Get package.json version
      id: package
      run: |
        PACKAGE_VERSION=$(jq -r '.version' package.json)
        echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
        echo "Package.json version: $PACKAGE_VERSION"

    - name: Compare versions
      id: compare
      run: |
        TAG_VERSION="${{ steps.extract.outputs.version }}"
        PKHEX_VERSION="${{ steps.pkhex.outputs.version }}"
        PACKAGE_VERSION="${{ steps.package.outputs.version }}"

        echo "Comparing versions:"
        echo "  Tag version: $TAG_VERSION"
        echo "  PKHeX version: $PKHEX_VERSION"
        echo "  Package.json version: $PACKAGE_VERSION"

        normalize_version() {
          echo "$1" | sed -E 's/\.0+([0-9])/.\1/g'
        }

        NORMALIZED_TAG=$(normalize_version "$TAG_VERSION")
        NORMALIZED_PKHEX=$(normalize_version "$PKHEX_VERSION")
        NORMALIZED_PACKAGE=$(normalize_version "$PACKAGE_VERSION")

        echo "Normalized versions:"
        echo "  Tag version: $NORMALIZED_TAG"
        echo "  PKHeX version: $NORMALIZED_PKHEX"
        echo "  Package.json version: $NORMALIZED_PACKAGE"

        ERRORS=0

        if [ "$NORMALIZED_TAG" = "$NORMALIZED_PKHEX" ]; then
          echo "Tag version matches PKHeX version exactly"
        elif [[ "$NORMALIZED_TAG" =~ ^${NORMALIZED_PKHEX}-.+$ ]]; then
          echo "Tag version ($NORMALIZED_TAG) is a hotfix of PKHeX version ($NORMALIZED_PKHEX)"
        else
          echo "Tag version ($NORMALIZED_TAG) does not match or start with PKHeX version ($NORMALIZED_PKHEX)"
          ERRORS=$((ERRORS + 1))
        fi

        if [ "$NORMALIZED_TAG" = "$NORMALIZED_PACKAGE" ]; then
          echo "Package.json version matches tag exactly"
        else
          echo "Package.json version ($NORMALIZED_PACKAGE) does not match tag version ($NORMALIZED_TAG)"
          ERRORS=$((ERRORS + 1))
        fi

        if [ $ERRORS -eq 0 ]; then
          echo "All versions match. Deployment will proceed."
          echo "should_deploy=true" >> $GITHUB_OUTPUT
        else
          echo "Version mismatch detected. Deployment will be skipped."
          echo "should_deploy=false" >> $GITHUB_OUTPUT
          exit 1
        fi

  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    needs: validate-version
    if: needs.validate-version.outputs.should_deploy == 'true'

    steps:
    - name: Wait for CI workflow to complete
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SHA="${{ github.sha }}"
        echo "Waiting for CI workflow to pass on commit $SHA..."

        for i in $(seq 1 60); do
          RUNS=$(gh api repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA --jq '.workflow_runs[] | {status, conclusion}')

          if [ -z "$RUNS" ]; then
            echo "Attempt $i: No CI runs found yet, waiting..."
            sleep 30
            continue
          fi

          STATUS=$(echo "$RUNS" | jq -r '.status' | head -1)
          CONCLUSION=$(echo "$RUNS" | jq -r '.conclusion' | head -1)

          echo "Attempt $i: CI status=$STATUS conclusion=$CONCLUSION"

          if [ "$STATUS" = "completed" ]; then
            if [ "$CONCLUSION" = "success" ]; then
              echo "CI passed!"
              exit 0
            else
              echo "CI failed with conclusion: $CONCLUSION"
              exit 1
            fi
          fi

          sleep 30
        done

        echo "Timed out waiting for CI (30 minutes)"
        exit 1

  generate-docs:
    name: Generate TSDoc Documentation
    runs-on: ubuntu-latest
    environment: build
    needs: [validate-version, wait-for-ci]
    if: needs.validate-version.outputs.should_deploy == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install documentation tools
      run: |
        npm install -g typedoc
        sudo apt-get update
        sudo apt-get install -y pandoc calibre python3-pip
        pip3 install weasyprint

    - name: Download build artifacts
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci.yml
        commit: ${{ github.sha }}
        name: pkhex-wasm-build
        path: dist/

    - name: Generate documentation (HTML, PDF, EPUB, MOBI)
      run: |
        chmod +x scripts/generate-docs.sh
        ./scripts/generate-docs.sh

    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: pkhex-wasm-docs
        path: docs/
        retention-days: 90

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, wait-for-ci, generate-docs]
    if: needs.validate-version.outputs.should_deploy == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download tarball
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci.yml
        commit: ${{ github.sha }}
        name: pkhex-wasm-tarball

    - name: Download build artifacts
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci.yml
        commit: ${{ github.sha }}
        name: pkhex-wasm-build
        path: dist/

    - name: Download documentation
      uses: actions/download-artifact@v4
      with:
        name: pkhex-wasm-docs
        path: docs/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.validate-version.outputs.version }}
        files: |
          pkhex-wasm-${{ needs.validate-version.outputs.version }}.tar.gz
          dist/dotnet.js
          dist/dotnet.native.wasm
          dist/PKHeX.dll
          dist/PKHeX.Core.dll
          dist/index.d.ts
          docs/PKHeX-API-Documentation.pdf
          docs/PKHeX-API-Documentation.epub
          docs/PKHeX-API-Documentation.mobi
        generate_release_notes: true
        body: |
          ## PKHeX WASM ${{ needs.validate-version.outputs.version }}

          Built against PKHeX.Core ${{ needs.validate-version.outputs.pkhex_version }}

          ### Installation

          ```bash
          npm install pkhex@${{ needs.validate-version.outputs.version }}
          ```

          ### Documentation

          - [Online Documentation](https://pokality.github.io/PkHeX.js/)
          - [PDF Documentation](./PKHeX-API-Documentation.pdf)
          - [EPUB Documentation](./PKHeX-API-Documentation.epub)
          - [MOBI Documentation](./PKHeX-API-Documentation.mobi)

          ### What's Changed
          See the full changelog below.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [validate-version, generate-docs]
    if: needs.validate-version.outputs.should_deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Download documentation
      uses: actions/download-artifact@v4
      with:
        name: pkhex-wasm-docs
        path: docs/

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  npm-publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    environment: release
    needs: [validate-version, wait-for-ci, github-release, github-pages]
    if: needs.validate-version.outputs.should_deploy == 'true'

    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Download build artifacts
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci.yml
        commit: ${{ github.sha }}
        name: pkhex-wasm-build
        path: dist/

    - name: Publish to NPM
      working-directory: dist/
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
